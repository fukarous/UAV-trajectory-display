.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{
  background:#fff;border:1px solid #dfe8f4;border-radius:14px;padding:22px 24px;
  box-shadow:0 2px 10px rgba(30,80,160,.06);

.card:hover{border-color:#9cc1f0;box-shadow:0 6px 20px rgba(30,80,160,.12);transform:translateY(-2px)}

.card .go{font-size:13px;color:#7a8ea8}

.card .go::after{content:' →'}
.card:nth-child(2) .stat b{color:#f59e0b}
